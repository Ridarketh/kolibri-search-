<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233D"/>
      <stop offset="1" stop-color="#090E1C"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0E9F6E"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#B6F7DA"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <g transform="translate(-4 -3) scale(1.06)">
    <!-- wing -->
    <path d="M60 50 C68 30 86 16 114 12 C108 32 92 50 70 62 Z" fill="url(#wing)"/>
    <!-- forked tail -->
    <path d="M80 86 L104 114 L98 92 Z" fill="#0E9F6E"/>
    <path d="M84 84 L116 100 L98 88 Z" fill="#12B27B"/>
    <!-- body -->
    <path d="M38 46 C40 70 58 88 84 94 C92 96 96 90 92 84 C82 66 70 52 58 38 C50 32 40 36 38 46 Z" fill="url(#plume)"/>
    <!-- ruby throat -->
    <path d="M38 50 C40 60 46 66 54 68 C52 60 48 54 40 48 Z" fill="#F43F5E"/>
    <!-- beak -->
    <path d="M10 57 L39 44 L41 50 Z" fill="#E2E8F0"/>
    <!-- eye -->
    <circle cx="48" cy="44" r="3.4" fill="#090E1C"/>
    <circle cx="47" cy="43" r="1.1" fill="#FFFFFF"/>
  </g>
</svg>
